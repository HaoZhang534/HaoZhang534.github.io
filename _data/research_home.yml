biography: 'I''m a Research Scientist at [NVIDIA Research](https://research.nvidia.com/), focusing on agentic AI
  and reinforcement learning for capable, scalable LLM agents. My research also spans large multimodal models, visual
  understanding, and efficient generative inference. I graduated in August 2024 from the [Department of Computer
  Science & Engineering](https://cse.hkust.edu.hk/), [Hong Kong University of Science and Technology](https://hkust.edu.hk/),
  with a Ph.D. co-supervised by Prof. [Heung-Yeung Shum](https://scholar.google.com/citations?user=9akH-n8AAAAJ&hl=zh-CN)
  and Prof. [Lionel M. Ni](https://scholar.google.com/citations?user=OzMYwDIAAAAJ&hl=zh-CN). I interned at [International
  Digital Economy Academy, Shenzhen](https://idea.edu.cn/) (advised by Prof. [Lei Zhang](https://www.leizhang.org/))
  and [Microsoft Research, Redmond](https://www.microsoft.com/en-us/research/group/deep-learning-group/) (advised
  by Dr. [Jianwei Yang](https://jwyang.github.io/) and Dr. [Chunyuan Li](https://chunyuan.li/)).

  Previously, I obtained my bachelor''s degree from the School of Electronic Information and Electrical Engineering
  at Shanghai Jiao Tong University in 2019.'
