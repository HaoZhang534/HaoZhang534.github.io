news:
- date: 2026/11
  text: '[REINFORCE Zero](https://hijkzzz.github.io/REINFORCE-Zero/), on kernel alignment for stable asynchronous
    RL with importance sampling, is released.'
- date: 2026/10
  text: '[Nemotron 3.5 Super and Lightning](https://arxiv.org/abs/2610.38095), open hybrid models for agentic AI,
    is released.'
- date: 2026/10
  text: '[AgentBaton](https://arxiv.org/abs/2610.35959) and [LoGRA](https://arxiv.org/abs/2610.06647), on efficient
    agent collaboration and memory-efficient RL, are released.'
- date: 2026/09
  text: '[Skill2Env](https://yifanzhang-pro.github.io/Skill2Env/) and [OSWorld-Pro](https://arxiv.org/abs/2609.24890),
    on training and evaluating agents, are released.'
- date: 2026/09
  text: '[Agora](https://yifanzhang-pro.github.io/Agora/) and [FlashREINFORCE](https://yifanzhang-pro.github.io/FlashREINFORCE/),
    on collective AutoResearch and asynchronous agentic RL, are released.'
- date: 2026/07
  text: '[Molt](https://arxiv.org/abs/2607.21653), a scalable PyTorch-native training framework for agentic reinforcement
    learning, is released.'
- date: 2026/05
  text: '[Polar](https://arxiv.org/abs/2605.24220), a scalable rollout framework for agentic RL on arbitrary harnesses,
    is released.'
- date: 2026/04
  text: '[Nemotron 3 Nano Omni](https://arxiv.org/abs/2604.24954), an efficient open multimodal model, is released.'
- date: 2026/03
  text: '[ProRL Agent](https://arxiv.org/abs/2603.18815), rollout-as-a-service for multi-turn LLM-agent RL training,
    is released and integrated with NVIDIA NeMo Gym.'
- date: 2026/01
  text: '[Fast-dLLM](https://arxiv.org/abs/2505.22618) and [Fast-dLLM v2](https://arxiv.org/abs/2509.26328) are
    accepted to ICLR 2026.'
- date: 2025/07
  text: '[Scaling Up RL: Unlocking Diverse Reasoning in LLMs via Prolonged Training](https://scholar.google.com/citations?view_op=view_citation&hl=en&user=B8hPxMQAAAAJ&sortby=pubdate&citation_for_view=B8hPxMQAAAAJ:NaGl4SEjCO4C)
    is released.'
- date: 2025/03
  text: '[GR00T N1](https://arxiv.org/abs/2503.14734), an open foundation model for generalist humanoid robots,
    is released.'
- date: 2025/01
  text: '[LLaVA-NeXT-Interleave](https://arxiv.org/abs/2407.07895) is accepted to ICLR 2025.'
- date: 2024/09
  text: '[Grounding DINO](https://arxiv.org/abs/2303.05499), a highly cited open-set object detector, is presented
    at ECCV 2024.'
- date: 2023/06
  text: '[Mask DINO](https://arxiv.org/abs/2206.02777), a unified framework for object detection and segmentation,
    is presented at CVPR 2023.'
- date: 2023/05
  text: '[DINO](https://arxiv.org/abs/2203.03605), an end-to-end detector with improved denoising anchor boxes,
    is presented at ICLR 2023.'
- date: 2022/06
  text: '[DN-DETR](https://arxiv.org/abs/2203.01305) is presented as a CVPR 2022 oral.'
